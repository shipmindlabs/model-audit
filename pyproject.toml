[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-audit"
version = "0.1.0"
description = "Audit trail for Django models: field-level diffs on save, who changed what, and declarative HTTP request logging."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Shipmind Labs", email = "hello@shipmindlabs.com" }]
keywords = ["django", "audit", "audit-trail", "changelog", "logging", "diff"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["Django>=4.2"]

[project.urls]
Homepage = "https://github.com/shipmindlabs/model-audit"
Source = "https://github.com/shipmindlabs/model-audit"
Issues = "https://github.com/shipmindlabs/model-audit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/model_audit"]

[tool.hatch.build.targets.sdist]
include = ["src/model_audit", "README.md", "LICENSE"]
